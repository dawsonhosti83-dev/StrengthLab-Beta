<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a19"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="StrengthLab"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>StrengthLab</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#edf7f1;background:#0c1413}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:640px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{font-size:25px;letter-spacing:-1px;margin:0}h2{font-size:19px;margin:0 0 14px}h3{font-size:15px;margin:0 0 10px}.muted,.hint{color:#a1b7ae}.hint{font-size:12px;line-height:1.5}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#8dbfa9}.card{background:#172522;border:1px solid #30433c;border-radius:18px;padding:17px;margin-bottom:13px}.hero{background:linear-gradient(125deg,#194536,#172522)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{font-size:25px;font-weight:750;margin-top:5px}.small{font-size:13px}.pill{display:inline-block;background:#254d3d;color:#b6efd1;padding:5px 9px;border-radius:30px;font-size:12px}.progress{height:8px;border-radius:20px;background:#31433d;overflow:hidden;margin-top:12px}.progress>span{display:block;height:100%;background:#56c99b;border-radius:20px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stack{display:grid;gap:11px}label{display:block;font-size:12px;color:#b5ccc1;margin-bottom:6px}input,select{background:#0e1b18;border:1px solid #3d5349;border-radius:11px;padding:12px;color:#f0faf4;width:100%;min-width:0}input[type=range]{padding:0;accent-color:#62d2a3;border:0}input[type=date]{color-scheme:dark}.btn{background:#54c696;border:0;color:#092018;padding:12px 16px;border-radius:12px;font-weight:750}.btn.secondary{background:#2a3d35;color:#e2f2e9}.btn.danger{background:#713e42;color:white}.btn:disabled{opacity:.5}.buttons{display:flex;gap:8px;flex-wrap:wrap}.buttons>*{flex:1}.nav{position:fixed;bottom:0;left:0;right:0;background:#101c19ed;backdrop-filter:blur(18px);border-top:1px solid #32483d;display:flex;justify-content:center;padding:10px 5px calc(10px + env(safe-area-inset-bottom));z-index:4}.nav button{background:none;border:0;color:#9bb8a9;padding:7px 10px;font-size:12px;flex:1;max-width:120px}.nav button.active{color:#74e6b1;font-weight:750}.hidden{display:none!important}.listitem{border-top:1px solid #32483d;padding:11px 0}.listitem:first-child{border-top:0}.tag{font-size:11px;color:#a3bbae}.bar{height:9px;background:#32463c;border-radius:10px;overflow:hidden}.bar>span{display:block;height:100%;background:#5cbd98}.warning{color:#ffce7c}.good{color:#7ee4b0}video{width:100%;border-radius:12px;max-height:300px;background:#000}.seg{display:flex;background:#0d1916;border-radius:12px;padding:4px;gap:4px}.seg button{flex:1;border:0;border-radius:9px;background:transparent;color:#b7c9c0;padding:10px 5px}.seg button.active{background:#315c49;color:white}.notice{background:#284536;border-radius:10px;padding:12px;font-size:13px;margin:12px 0}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}.link{color:#8ae0b5}a{color:#8ae0b5}@media(min-width:700px){.app{padding-top:36px}.nav{max-width:640px;margin:auto;border-left:1px solid #32483d;border-right:1px solid #32483d}}

:root{--accent-hue:155} .btn:not(.secondary):not(.danger),.seg button.active,.nav button.active{filter:hue-rotate(calc((var(--accent-hue) - 155) * 1deg))} .accent{color:hsl(var(--accent-hue),68%,65%)}details.folder{background:#142321;border:1px solid #28433b;border-radius:14px;margin:9px 0;padding:12px}details.folder summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}details.folder summary::-webkit-details-marker{display:none}.subtle{font-size:12px;opacity:.7}.chip{border:1px solid #355248;border-radius:20px;padding:6px 10px;background:#172b26;color:#e6fff2;display:inline-block;margin:3px;cursor:pointer}.chips{display:flex;flex-wrap:wrap;gap:4px}.mini{padding:8px;border-radius:9px;background:#0d1d1a;margin-top:8px}.mini strong{font-size:13px} .splitline{display:flex;align-items:center;gap:8px;margin:6px 0}.splitline input{flex:1;min-width:0} #scannerTarget video{max-width:100%;border-radius:12px} .scrollhint{font-size:12px;opacity:.8}
</style></head><body><main class="app"><header><div><div class="eyebrow">Nutrition + training intelligence</div><h1>StrengthLab <span style="color:#68d9a7">●</span></h1></div><span class="pill">Personal tracker</span></header><div id="notice" class="notice hidden"></div><section id="today"></section><section id="food" class="hidden"></section><section id="workout" class="hidden"></section><section id="insights" class="hidden"></section><section id="settings" class="hidden"></section></main><nav class="nav" id="nav"><button data-tab="today" class="active">⌂<br>Today</button><button data-tab="food">▤<br>Food</button><button data-tab="workout">▥<br>Workout</button><button data-tab="insights">▤<br>Insights</button><button data-tab="settings">⚙<br>Settings</button></nav><script>
const KEY='strengthlab-v1';const DAYS=[['Sunday','Chest','Front & Side Delts','Biceps','Hamstrings'],['Monday','Lats','Lower Traps','Triceps','Rear Delts'],['Tuesday','Quads','Front & Side Delts','Calves'],['Wednesday','Hamstrings','Rear Delts','Lats','Lower Traps','Triceps'],['Thursday','Chest','Front & Side Delts','Quads','Calves','Biceps'],['Friday'],['Saturday']];const builtins=[{name:'Banana',kcal:89,c:22.8,p:1.1,f:.3},{name:'Cooked white rice',kcal:130,c:28.2,p:2.7,f:.3},{name:'Cooked chicken breast',kcal:165,c:0,p:31,f:3.6},{name:'Dry oatmeal',kcal:389,c:66.3,p:16.9,f:6.9},{name:'Rice cakes',kcal:387,c:81.5,p:8.2,f:2.8}];const defaults={themeHue:155,water:[],favorites:[],split:DAYS.map(d=>({name:d[0],muscles:d.slice(1)})),servingUnit:'g',foods:[],sets:[],custom:[],weightUnit:'lb',massUnit:'g',volumeUnit:'ml',bodyWeight:150,calGoal:2400,proteinGoal:150,carbGoal:250,selectedDate:new Date().toLocaleDateString('en-CA'),day:new Date().getDay(),foodIndex:0,foodAmount:100};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{db=structuredClone(defaults)};db={...defaults,...db};if(!Array.isArray(db.split)||db.split.length!==7)db.split=structuredClone(defaults.split);if(!Array.isArray(db.water))db.water=[];if(!Array.isArray(db.favorites))db.favorites=[];let tab='today',foodMode='search',scanStream=null,scanLoop=false;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=(n,d=0)=>Number(n||0).toFixed(d),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Storage unavailable. Export a backup.')}};const foodList=()=>[...builtins,...db.custom];const dayName=()=>db.split[db.day].name;const massFactor=()=>db.massUnit==='oz'?28.349523125:1;const volumeFactor=()=>db.volumeUnit==='fl oz'?29.57352956:1;const weightFactor=()=>db.weightUnit==='lb'?2.2046226218:1;const sum=(items,key)=>items.reduce((a,b)=>a+(+b[key]||0),0);const uid=()=>Date.now()+Math.random();const dateField=()=>`<label>Session date</label><input type="date" id="sessionDate" value="${esc(db.selectedDate)}">`;function message(s){$('notice').textContent=s;$('notice').classList.remove('hidden');setTimeout(()=>$('notice').classList.add('hidden'),4500)}function go(t){if(t!=='food')stopScan();tab=t;document.querySelectorAll('main section').forEach(x=>x.classList.toggle('hidden',x.id!==t));document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render()};document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));function render(){if(tab==='today')renderToday();if(tab==='food')renderFood();if(tab==='workout')renderWorkout();if(tab==='insights')renderInsights();if(tab==='settings')renderSettings()};function setField(id,key,cast=x=>x){const e=$(id);if(e)e.onchange=()=>{db[key]=cast(e.value);save();render()}};function currentFoods(){return db.foods.filter(f=>f.date===db.selectedDate)}function currentSets(){return db.sets.filter(s=>s.date===db.selectedDate)}
const EXERCISES={'Chest':['Incline Smith Press','Flat Bench Press','Machine Chest Press','Cable Fly','Pec Deck'],'Front & Side Delts':['Cable Lateral Raise','Machine Lateral Raise','Dumbbell Lateral Raise','Shoulder Press','Front Raise'],'Biceps':['Incline Curl','Preacher Curl','Cable Curl','Hammer Curl'],'Hamstrings':['Seated Leg Curl','Lying Leg Curl','Romanian Deadlift'],'Lats':['Lat Pulldown','Single-Arm Lat Pulldown','Chest-Supported Row','Cable Row'],'Lower Traps':['Prone Y Raise','Cable Y Raise','Incline Trap Raise'],'Triceps':['Cable Pushdown','Overhead Cable Extension','Skull Crusher'],'Rear Delts':['Reverse Pec Deck','Rear Delt Cable Fly','Face Pull'],'Quads':['Hack Squat','Leg Press','Leg Extension','Squat'],'Calves':['Seated Calf Raise','Standing Calf Raise','Leg Press Calf Raise']};
const exercisesFor=m=>[...new Set([...(EXERCISES[m]||[]),...db.sets.filter(s=>s.muscle===m).map(s=>s.exercise)])];
const cleanName=s=>String(s||'').trim().toLowerCase();
const dayMuscles=()=>db.split[db.day].muscles;
const currentWater=()=>db.water.filter(x=>x.date===db.selectedDate);
const waterML=()=>sum(currentWater(),'ml');
const theme=()=>document.documentElement.style.setProperty('--accent-hue',db.themeHue);
const e1rm=s=>s.kg*(1+s.reps/30);
function statsFor(ex){const arr=db.sets.filter(s=>cleanName(s.exercise)===cleanName(ex)).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);if(!arr.length)return null;const best=arr.reduce((a,b)=>e1rm(b)>e1rm(a)?b:a);const last=arr[arr.length-1];return {best,last,n:arr.length};}
function folders(muscles){return muscles.map(m=>`<details class="folder"><summary><span>${esc(m)}</span><span class="subtle">${exercisesFor(m).length} exercises ▾</span></summary>${exercisesFor(m).map(ex=>{const st=statsFor(ex);return `<div class="mini"><strong>${esc(ex)}</strong><div class="subtle">${st?`PR (estimated 1RM): ${num(e1rm(st.best)*weightFactor(),1)} ${db.weightUnit} · ${num(st.best.kg*weightFactor(),1)} × ${st.best.reps}<br>Last: ${esc(st.last.date)} · ${num(st.last.kg*weightFactor(),1)} ${db.weightUnit} × ${st.last.reps} · ${st.last.rir} RIR`:'PR: — · Last session: —'}</div><button class="chip" data-exercise="${esc(ex)}" data-muscle="${esc(m)}">Log this exercise</button></div>`}).join('')}</details>`).join('')}
function bindFolders(){document.querySelectorAll('[data-exercise]').forEach(b=>b.onclick=()=>{const e=$('exercise');if(e)e.value=b.dataset.exercise;const m=$('muscle');if(m)m.value=b.dataset.muscle;document.getElementById('liftLoad')?.scrollIntoView({behavior:'smooth',block:'center'});});}
function renderWater(){return `<div class="card stack"><h3>Fluid tracking</h3><div class="row"><strong>${Math.round(waterML())} mL today</strong><span class="hint">${num(waterML()/29.5735,1)} US fl oz</span></div><label>Amount</label><div class="row"><input id="waterAmount" type="number" min="1" step="any" value="250"><select id="waterUnit"><option value="ml">mL</option><option value="l">liters</option><option value="floz">US fl oz</option><option value="cup">US cups</option></select></div><button class="btn" id="addWater">Log fluid</button>${currentWater().slice(-5).reverse().map(w=>`<div class="row listitem"><span>${num(w.ml,0)} mL</span><button class="btn secondary" data-water-delete="${w.id}">×</button></div>`).join('')}</div>`}
function bindWater(){if(!$('addWater'))return;$('addWater').onclick=()=>{const n=Number($('waterAmount').value);if(!(n>0))return message('Enter a positive fluid amount');const factor={ml:1,l:1000,floz:29.57352956,cup:236.5882365}[$('waterUnit').value];db.water.push({id:uid(),date:db.selectedDate,ml:n*factor});save();render();message('Fluid logged')};document.querySelectorAll('[data-water-delete]').forEach(b=>b.onclick=()=>{db.water=db.water.filter(w=>String(w.id)!==b.dataset.waterDelete);save();render()})}
theme();
function renderToday(){const f=currentFoods(),s=currentSets(),c=sum(f,'kcal'),p=sum(f,'p'),carb=sum(f,'c');$('today').innerHTML=`<div class="card hero"><div class="eyebrow">Daily energy</div><div class="stat">${Math.round(c)} <span class="muted small">/ ${db.calGoal} kcal</span></div><div class="progress"><span style="width:${Math.min(100,c/db.calGoal*100)}%"></span></div><p class="hint">${Math.round(db.calGoal-c)} kcal remaining against your target</p></div><div class="grid3">${[['Protein',p,db.proteinGoal],['Carbs',carb,db.carbGoal],['Fat',sum(f,'f'),70]].map(([n,v,g])=>`<div class="card"><div class="tag">${n}</div><div class="stat" style="font-size:19px">${Math.round(v)}g</div><div class="bar"><span style="width:${Math.min(100,v/g*100)}%"></span></div><div class="hint">${g}g target</div></div>`).join('')}</div><div class="card stack">${dateField()}<h3>Training split</h3><div class="seg">${db.split.map((d,i)=>`<button data-day="${i}" class="${i===db.day?'active':''}">${d[0].slice(0,3)}</button>`).join('')}</div><div class="row"><strong>${dayName()}</strong><span class="pill">${db.split[db.day].muscles.length>0?'Training':'Rest'}</span></div><div class="small muted">${db.split[db.day].muscles.join(' · ')||'Recovery day'}</div><div class="row"><span>Working sets logged</span><strong>${s.length}</strong></div><div class="row"><span>Session load-volume</span><strong>${Math.round(sum(s.map(x=>({...x,vol:x.kg*x.reps*weightFactor()})),'vol'))} ${db.weightUnit}·reps</strong></div><div class="buttons"><button class="btn secondary" id="quickFood">+ Food</button><button class="btn" id="quickWorkout">+ Set</button></div></div><p class="hint">Totals reflect the selected date. Nutrient values are estimates and targets are editable.</p>`;setField('sessionDate','selectedDate');document.querySelectorAll('[data-day]').forEach(x=>x.onclick=()=>{db.day=+x.dataset.day;save();render()});$('quickFood').onclick=()=>go('food');$('quickWorkout').onclick=()=>go('workout')}
function renderFood(){const f=foodList(),selected=f[db.foodIndex]||f[0],portion=db.foodAmount*(db.massUnit==='oz'?massFactor():1)/100,lookup=foodMode==='scan';$('food').innerHTML=`<h2>Food diary</h2><div class="seg"><button data-mode="search" class="${foodMode==='search'?'active':''}">Search</button><button data-mode="scan" class="${lookup?'active':''}">Scan</button><button data-mode="custom" class="${foodMode==='custom'?'active':''}">Custom</button></div><div class="card stack" id="foodEntry">${foodMode==='search'?`<label>Food selection</label><select id="foodSelect">${f.map((x,i)=>`<option value="${i}" ${i===db.foodIndex?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div class="row"><strong>Serving size</strong><strong id="servingDisplay">${db.foodAmount} ${db.massUnit}</strong></div><input id="servingSlider" type="range" min="1" max="${db.massUnit==='oz'?20:600}" step="1" value="${db.foodAmount}"><input id="servingInput" type="number" min=".01" step="any" value="${db.foodAmount}"><div class="seg"><button id="gBtn" class="${db.massUnit==='g'?'active':''}">grams</button><button id="ozBtn" class="${db.massUnit==='oz'?'active':''}">ounces</button></div><div class="grid3"><div><div class="tag">Calories</div><strong id="servKcal">${Math.round(selected.kcal*portion)}</strong></div><div><div class="tag">Carbs</div><strong id="servCarbs">${num(selected.c*portion,1)}g</strong></div><div><div class="tag">Protein</div><strong id="servProtein">${num(selected.p*portion,1)}g</strong></div></div><button class="btn" id="addFood">Add to diary</button>`:lookup?`<h3>Scan food barcode</h3><p class="hint">Point your camera at a UPC/EAN barcode. On compatible iPhones, the camera scanner will attempt to detect it. QR contents can also be entered manually.</p><video id="camera" playsinline muted></video><button class="btn" id="startScan">Start camera</button><button class="btn secondary" id="stopScan">Stop camera</button><label>Barcode number or QR text</label><input id="barcode" placeholder="e.g. 737628064502"><button class="btn" id="lookup">Look up product</button><p class="hint">Uses Open Food Facts, a crowdsourced food database. Coverage and accuracy vary. A QR code is not necessarily a food product barcode.</p>`:`<h3>Create food</h3><label>Name</label><input id="customName" placeholder="Food name"><p class="hint">Enter nutrition per 100 g.</p><div class="grid">${[['kcal','Calories'],['c','Carbs (g)'],['p','Protein (g)'],['f','Fat (g)']].map(([id,n])=>`<div><label>${n}</label><input id="custom_${id}" type="number" min="0" step="any" value="0"></div>`).join('')}</div><button class="btn" id="saveCustom">Save food</button>`}</div><div class="card"><h3>Foods logged for ${esc(db.selectedDate)}</h3>${currentFoods().length?currentFoods().map(x=>`<div class="listitem row"><div><strong>${esc(x.name)}</strong><div class="hint">${Math.round(x.kcal)} kcal · ${num(x.c,1)}g carbs · ${num(x.p,1)}g protein</div></div><button class="btn secondary" data-del-food="${x.id}">×</button></div>`).join(''):'<p class="hint">No foods logged yet.</p>'}</div>`;document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>{stopScan();foodMode=x.dataset.mode;render()});document.querySelectorAll('[data-del-food]').forEach(x=>x.onclick=()=>{db.foods=db.foods.filter(f=>String(f.id)!==x.dataset.delFood);save();render()});if(foodMode==='search'){setField('foodSelect','foodIndex',Number);$('servingSlider').oninput=e=>changeServing(+e.target.value);$('servingInput').oninput=e=>changeServing(+e.target.value);$('gBtn').onclick=()=>switchMass('g');$('ozBtn').onclick=()=>switchMass('oz');$('addFood').onclick=()=>{const base=db.foodAmount*massFactor()/100;db.foods.push({id:uid(),date:db.selectedDate,name:selected.name,kcal:selected.kcal*base,c:selected.c*base,p:selected.p*base,f:selected.f*base});save();message('Food logged');render()}}else if(lookup){$('startScan').onclick=startScan;$('stopScan').onclick=stopScan;$('lookup').onclick=()=>lookupCode($('barcode').value.tr async function lookupCode(code){if(!code)return message('Enter a barcode first');message('Looking up product…');try{const res=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,nutriments,code,quantity',{headers:{Accept:'application/json'}});if(!res.ok)throw Error('Network error');const data=await res.json();if(data.status!==1||!data.product)throw Error('Product not found');const n=data.product.nutriments||{},name=data.product.product_name||'Product '+code;const item={name,kcal:Number(n['energy-kcal_100g'])||0,c:Number(n.carbohydrates_100g)||0,p:Number(n.proteins_100g)||0,f:Number(n.fat_100g)||0};db.custom.push(item);db.foodIndex=foodList().length-1;db.foodAmount=db.massUnit==='oz'?3.53:100;save();stopScan();foodMode='search';render();message('Product found. Verify label and serving size.')}catch(e){message('Could not find product: '+e.message+'. You can enter it as a custom food.')}}async function startScan(){if(!navigator.mediaDevices?.getUserMedia)return message('Camera requires HTTPS and a supported browser');if(!('BarcodeDetector' in window))return message('Live barcode detection is not supported by this browser. Enter the barcode manually.');try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const video=$('camera');video.srcObject=scanStream;await video.play();scanLoop=true;const detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','qr_code']});async function frame(){if(!scanLoop)return;try{const codes=await detector.detect(video);if(codes.length){const raw=codes[0].rawValue;stopScan();$('barcode').value=raw;message('Code detected: '+raw);return}}catch{}setTimeout(frame,350)}frame()}catch(e){message('Camera unavailable: '+e.message)}}function stopScan(){scanLoop=false;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}

function renderSettings(){$('settings').innerHTML=`<h2>Preferences & backup</h2><div class="card stack"><h3>Theme color</h3><label>Accent hue: <strong id="hueValue">${db.themeHue}°</strong></label><input type="range" id="themeHue" min="0" max="360" value="${db.themeHue}"><p class="hint">Drag to change the accent colors across the app.</p><label>Calorie goal</label><input id="calGoal" type="number" value="${db.calGoal}"><label>Protein goal (g)</label><input id="proteinGoal" type="number" value="${db.proteinGoal}"><label>Carb goal (g)</label><input id="carbGoal" type="number" value="${db.carbGoal}"><label>Body weight (lb)</label><input id="bodyWeight" type="number" value="${db.bodyWeight}"></div><div class="card stack"><h3>Customize your split</h3><p class="hint">Separate muscle groups with commas. Changes won't erase your logged sets.</p>${db.split.map((d,i)=>`<label>${esc(d.name)}</label><input id="split_${i}" value="${esc(d.muscles.join(', '))}" placeholder="Rest day or muscle groups">`).join('')}<button class="btn" id="saveSplit">Save split</button><button class="btn secondary" id="resetSplit">Restore original split</button></div><div class="card stack"><h3>Data portability</h3><button class="btn" id="export">Export JSON backup</button><label>Import previous JSON backup</label><input id="import" type="file" accept="application/json,.json"><button class="btn danger" id="clear">Delete all saved data</button><p class="hint">Data is stored in this browser on this device, not synced to an account. Export backups regularly.</p></div><div class="card"><h3>Install on iPhone</h3><p class="small">Use Safari → Share → Add to Home Screen. Scanner requires HTTPS, camera permission, and an internet connection for the fallback library. Product lookup uses Open Food Facts.</p></div>`;['calGoal','proteinGoal','carbGoal','bodyWeight'].forEach(k=>setField(k,k,Number));$('themeHue').oninput=e=>{db.themeHue=+e.target.value;$('hueValue').textContent=db.themeHue+'°';theme();save()};$('saveSplit').onclick=()=>{db.split=db.split.map((d,i)=>({...d,muscles:[...new Set($('split_'+i).value.split(',').map(x=>x.trim()).filter(Boolean))]}));save();render();message('Split updated')};$('resetSplit').onclick=()=>{if(confirm('Restore original split?')){db.split=structuredClone(defaults.split);save();render()}};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='strengthlab-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed.foods)||!Array.isArray(parsed.sets))throw Error('Invalid backup');if(!confirm('Replace existing data with this backup?'))return;db={...defaults,...parsed};save();theme();render();message('Backup imported')}catch(e){message('Import failed: '+e.message)}};$('clear').onclick=()=>{if(confirm('Permanently delete all local StrengthLab data?')){db=structuredClone(defaults);save();theme();render();message('Local data cleared')}}}
